<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060911"><title>SIRIUS TR JOURNAL</title>
<style>
:root{--bg:#060911;--c:#0b101d;--c2:#0f1626;--b:rgba(255,255,255,.07);--t:#e6e9f0;--m:#7c869b;--g:#10b981;--r:#f43f5e;--y:#f59e0b;--bl:#3b82f6;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font:13px/1.45 Inter,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
.nav{border-right:1px solid var(--b);padding:18px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:650;letter-spacing:.02em;padding:0 10px 16px;font-size:14px}.brand small{display:block;color:var(--m);font-weight:400;font-size:11px}
.nav button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:6px;color:var(--m);cursor:pointer}
.nav button:hover{background:var(--c)}.nav button.on{background:var(--c2);color:var(--t);box-shadow:inset 2px 0 var(--y)}
main{padding:16px 22px 40px;min-width:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:16px;font-weight:600;margin-right:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip,.seg button,.btn{background:var(--c);border:1px solid var(--b);border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap;color:var(--m)}
.chip.on,.seg button.on{color:var(--t);border-color:rgba(245,158,11,.5);background:var(--c2)}
.seg{display:inline-flex;gap:4px;margin-bottom:14px}
.btn.p{background:var(--y);color:#1a1204;border-color:var(--y);font-weight:600}.btn.g{background:var(--g);border-color:var(--g);color:#04130d;font-weight:600}.btn.r{color:var(--r)}
.card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:14px;min-width:0}
.card h3{font-size:12px;font-weight:500;color:var(--m);margin-bottom:10px}
.grid{display:grid;gap:10px;margin-bottom:10px}.k4{grid-template-columns:repeat(4,1fr)}.k2{grid-template-columns:1fr 1fr}.k3{grid-template-columns:repeat(3,1fr)}.k21{grid-template-columns:2fr 1fr}
.kv{font-size:22px;font-weight:600;letter-spacing:-.01em}.sub{color:var(--m);font-size:12px;margin-top:2px}
.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.bl{color:var(--bl)}
.bar{height:4px;background:var(--b);border-radius:2px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--b)}.row:last-child{border:0}
.tw{overflow-x:auto;border:1px solid var(--b);border-radius:8px;background:var(--c)}
table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap}
th{font-weight:500;color:var(--m);text-align:left;padding:9px 12px;border-bottom:1px solid var(--b);font-size:12px}
td{padding:9px 12px;border-bottom:1px solid var(--b)}tbody tr{cursor:pointer}tbody tr:hover td{background:var(--c2)}
.s1{position:sticky;right:40px;background:var(--c);text-align:right}.s2{position:sticky;right:0;background:var(--c);width:40px}
.tag{display:inline-flex;white-space:nowrap;padding:1px 7px;border:1px solid var(--b);border-radius:4px;color:var(--m);font-size:11.5px;margin-right:4px}
.bd{display:inline-flex;white-space:nowrap;padding:1px 8px;border-radius:4px;font-size:11.5px;font-weight:600}
.bd.g{background:rgba(16,185,129,.14)}.bd.r{background:rgba(244,63,94,.14)}.bd.y{background:rgba(245,158,11,.14)}.bd.bl{background:rgba(59,130,246,.14)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{min-height:54px;border-radius:5px;padding:4px 6px;font-size:11px;background:var(--c2);color:var(--m)}
.cal .w{min-height:0;background:none;text-align:center}.cal .pg{background:rgba(16,185,129,.16);color:var(--g)}.cal .pr{background:rgba(244,63,94,.16);color:var(--r)}
.cal b{display:block;font-size:12px}
.live{border-left:2px solid var(--bl)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.acts .btn{padding:5px 9px;font-size:12px}
#modal{position:fixed;inset:0;background:rgba(3,5,10,.78);display:none;overflow:auto;padding:20px;z-index:9}
#modal.on{display:block}.mb{max-width:760px;margin:0 auto;background:var(--c);border:1px solid var(--b);border-radius:10px;padding:18px}
.mb h2{font-size:15px;margin-bottom:14px;display:flex;justify-content:space-between}
.f{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.f label{display:block;color:var(--m);font-size:12px}
.f input,.f select,.f textarea{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:6px;padding:7px 9px;margin-top:3px}
.f .w2{grid-column:1/-1}.tg{display:flex;gap:6px;margin-top:3px}.tg .btn{flex:1;text-align:center}
.tg .btn.on.g{background:var(--g);color:#04130d}.tg .btn.on.r{background:var(--r);color:#fff;border-color:var(--r)}.tg .btn.on.y{background:var(--y);color:#1a1204}.tg .btn.on.bl{background:var(--bl);color:#fff}
.tg .btn.on{border-color:transparent}
img.shot,video{width:100%;border-radius:6px;border:1px solid var(--b);max-height:62vh;object-fit:contain;background:#000}
.empty{color:var(--m);padding:22px;text-align:center}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time]{background:var(--bg);border:1px solid var(--b);border-radius:6px;padding:7px 9px;width:100%}
@media(max-width:820px){.app{grid-template-columns:minmax(0,1fr)}.nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;background:var(--bg);z-index:5;padding:6px;border-top:1px solid var(--b);border-right:0}.brand{display:none}.nav button{white-space:nowrap;box-shadow:none!important}main{padding:12px 12px 80px}.k4,.k3{grid-template-columns:1fr 1fr}.k2,.k21,.f{grid-template-columns:1fr}.kv{font-size:19px}}
html,body{overflow-x:hidden;max-width:100%}code{display:block;white-space:pre-wrap;word-break:break-all;font-size:11px;margin-top:6px}.card,.grid>*{min-width:0;overflow-wrap:anywhere}.f>*{min-width:0}@media(max-width:820px){.nav{padding-bottom:calc(6px + env(safe-area-inset-bottom))}}
</style></head><body>
<div class="app"><nav class="nav" id="nav"></nav><main id="main"></main></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const SES=['Азия','Франкфурт','Лондон','Нью-Йорк'],PSY=['По системе (A+ сетап)','FOMO (Погоня за ценой)','Тильт / Отыгрыш','Ранний выход (Страх)','Жадность (Завышен риск)'],
DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница'],MON=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const seed=()=>({acc:[{id:'a1',name:'Личный Счет',bal:10000,login:'5081234'},{id:'a2',name:'FTMO Prop 100k',bal:100000,login:'9910452'},{id:'a3',name:'Разгон Депозита',bal:500,login:'7741290'}],trades:[],
ins:{'Металлы и Сырье':'XAUUSD XAGUSD XPTUSD USOIL UKOIL NATGAS'.split(' '),'Индексы':'NAS100 US500 US30 GER40 UK100 JPN225 DXY'.split(' '),
'Forex':'EURUSD GBPUSD USDJPY USDCHF USDCAD AUDUSD NZDUSD EURGBP EURJPY GBPJPY EURCHF AUDJPY CADJPY GBPAUD EURAUD GBPCAD CHFJPY NZDJPY AUDCAD AUDNZD'.split(' '),'Crypto':['BTCUSD','ETHUSD','SOLUSD']},
strat:['Дисбаланс 1H','Дисбаланс 4H','Дисбаланс D','Ликвидность 1H фрактала','Франкфурт Хай лоу + FVG (H1-H4-D)','Рейд ликвидности 1H','Ликвидность 1H фрак + FVG','Азия Хай лоу + Фрактал (H1-H4-D)','Азия Хай лоу + FVG (H1-H4-D)'],
model:['Инверсия 15м','Инверсия 3м','Инверсия 5м','Сильное поглощение М5','Слом 15м','Слом 1Н','Слом 3м','Слом 5м','Шифт 1Н','Шифт 3м','Шифт 5м'],bot:{tok:'',chat:'',ok:0,off:0}});
let db=JSON.parse(localStorage.sirius||'null')||seed();const save=()=>localStorage.sirius=JSON.stringify(db);
const S={acc:'all',per:'all',tab:'dash',cm:new Date()};let F={},timer=300;
const idb=new Promise(r=>{const q=indexedDB.open('sirius',1);q.onupgradeneeded=()=>q.result.createObjectStore('m');q.onsuccess=()=>r(q.result)});
const mset=async(k,v)=>(await idb).transaction('m','readwrite').objectStore('m').put(v,k);
const mget=async k=>{const d=await idb;return new Promise(r=>{const q=d.transaction('m').objectStore('m').get(k);q.onsuccess=()=>r(q.result)})};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const m=v=>(v>=0?'+':'−')+'$'+Math.abs(v).toLocaleString('en',{maximumFractionDigits:2}),cl=v=>v>0?'g':v<0?'r':'',RC={TP:'g',SL:'r',BU:'y',OPEN:'bl'};
const accName=id=>(db.acc.find(a=>a.id==id)||{name:'—'}).name,toast=t=>alert(t);
const scope=()=>db.trades.filter(t=>S.acc=='all'||t.acc==S.acc);
function inPer(t){const n=new Date(),d=new Date(t.date+'T00:00'),p=S.per,a=iso(n);return p=='all'||(p=='day'&&t.date==a)||(p=='week'&&(n-d)/864e5<7&&d<=n)||(p=='month'&&t.date.slice(0,7)==a.slice(0,7))||(p=='year'&&t.date.slice(0,4)==a.slice(0,4))}
const sortT=l=>l.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const closed=(all)=>sortT(scope().filter(t=>t.res!='OPEN'&&(all||inPer(t))));
function stat(L){const tp=L.filter(t=>t.res=='TP').length,sl=L.filter(t=>t.res=='SL').length,bu=L.filter(t=>t.res=='BU').length,pnl=L.reduce((a,t)=>a+t.pnl,0),
gw=L.filter(t=>t.pnl>0).reduce((a,t)=>a+t.pnl,0),gl=-L.filter(t=>t.pnl<0).reduce((a,t)=>a+t.pnl,0);
return{n:L.length,tp,sl,bu,pnl,wr:tp+sl?tp/(tp+sl)*100:0,pf:gl?gw/gl:gw?99:0,rr:L.length?L.reduce((a,t)=>a+(+t.rr||0),0)/L.length:0}}
const grp=(L,f)=>{const o={};L.forEach(t=>{(o[f(t)]=o[f(t)]||[]).push(t)});return Object.entries(o).map(([k,v])=>({k,...stat(v)}))};
const base=()=>db.acc.filter(a=>S.acc=='all'||a.id==S.acc).reduce((a,x)=>a+x.bal,0);
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%;background:var(--${c})"></i></div>`;
const kpi=(l,v,s,c='')=>`<div class="card"><h3>${l}</h3><div class="kv ${c}">${v}</div><div class="sub">${s||''}</div></div>`;
function pnlOf(res,risk,rr,fee,man){if(man!==''&&man!=null&&!isNaN(man))return +man;risk=+risk||0;fee=+fee||0;return res=='TP'?risk*rr-fee:res=='SL'?-risk-fee:res=='BU'?-fee:0}
/* ---------- views ---------- */
const TABS=[['dash','Дашборд'],['journal','Журнал'],['open','Открытые сделки'],['psy','Психология & Дни/Часы'],['cons','Конструктор'],['set','Настройки APK & Бот']];
function render(){
$('#nav').innerHTML=`<div class="brand">SIRIUS TR JOURNAL<small>Trading analytics</small></div>`+TABS.map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('');
const chips=`<div class="chips"><button class="chip ${S.acc=='all'?'on':''}" onclick="S.acc='all';render()">🌐 Все счета</button>`+db.acc.map(a=>`<button class="chip ${S.acc==a.id?'on':''}" onclick="S.acc='${a.id}';render()">${a.id=='a2'?'🏆':a.id=='a3'?'🚀':'💼'} ${a.name}<span style="color:var(--m)"> · ${a.login}</span></button>`).join('')+`<button class="chip" onclick="addAcc()">+ Новый счет (MT5 ID)</button></div>`;
const per=(S.tab=='dash'||S.tab=='psy')?`<div class="seg">${[['day','День'],['week','Неделя'],['month','Месяц'],['year','Год'],['all','Все время']].map(([k,l])=>`<button class="${S.per==k?'on':''}" onclick="S.per='${k}';render()">${l}</button>`).join('')}</div>`:'';
const bot=db.bot.ok?`<span class="bd g">✅ Бот Подключен</span>`:`<span class="bd y">Бот не подключен</span>`;
$('#main').innerHTML=`<div class="top"><h1>${TABS.find(t=>t[0]==S.tab)[1]}</h1>${bot}<span class="sub">Синхр. через ${String(timer/60|0).padStart(2,'0')}:${String(timer%60).padStart(2,'0')}</span><button class="btn p" onclick="tradeForm()">+ Сделка</button></div>${chips}${per}`+V[S.tab]();
}
const V={};
V.dash=()=>{const L=closed(),s=stat(L),all=stat(closed(1)),bal=snaps().length?snaps().reduce((t,x)=>t+(+x.s.bal||0),0):base()+all.pnl,b0=base(),
lg=stat(L.filter(t=>t.dir=='BUY')),sh=stat(L.filter(t=>t.dir=='SELL')),pairs=grp(L,t=>t.sym).sort((a,b)=>b.pnl-a.pnl);
let eq=b0,pk=b0,dd=0,ddp=0;closed(1).forEach(t=>{eq+=t.pnl;pk=Math.max(pk,eq);if(pk-eq>dd){dd=pk-eq;ddp=dd/pk*100}});
return terminal()+openBlock(1)+`<div class="grid k4">${kpi('Чистая прибыль',m(s.pnl),`Депозит ${(b0?s.pnl/b0*100:0).toFixed(2)}% · Баланс $${bal.toLocaleString('en',{maximumFractionDigits:0})}`,cl(s.pnl))}
${kpi('Win Rate',s.wr.toFixed(1)+'%',`${s.n} сделок · <span class=g>${s.tp} TP</span> · <span class=r>${s.sl} SL</span> · <span class=y>${s.bu} БУ</span>`)}
${kpi('Profit Factor',s.pf.toFixed(2),'Средний RR 1:'+s.rr.toFixed(2))}
${kpi('Макс. просадка','−'+ddp.toFixed(2)+'%','−$'+dd.toFixed(0)+' · Лучшая пара: '+(pairs[0]&&pairs[0].pnl>0?pairs[0].k:'—'),'r')}</div>
<div class="grid k21"><div class="card"><h3>Кривая доходности</h3>${equity(L,b0)}</div>
<div class="card"><h3>Long vs Short</h3>${[['BUY / LONG',lg,'g'],['SELL / SHORT',sh,'r']].map(([n,x,c])=>`<div class="row"><div><span class="${c}"><b>${n}</b></span><div class="sub">${x.n} сделок · WR ${x.wr.toFixed(1)}%</div>${bar(x.wr,c)}</div><b class="${cl(x.pnl)}">${m(x.pnl)}</b></div>`).join('')}</div></div>
<div class="grid k4">${SES.map(n=>{const x=stat(L.filter(t=>t.session==n));return`<div class="card"><h3>${n}</h3><div class="kv ${cl(x.pnl)}">${m(x.pnl)}</div><div class="sub">WR ${x.wr.toFixed(0)}% · ${x.n} сделок</div>${bar(x.wr,'bl')}</div>`}).join('')}</div>
<div class="grid k21"><div class="card"><h3>PnL Календарь</h3>${calendar()}</div><div class="card"><h3>Эффективность стратегий и моделей входа</h3>${rank(L)}</div></div>`};
function equity(L,b0){if(L.length<1)return'<div class=empty>Нет закрытых сделок за период</div>';let e=b0;const p=[e,...L.map(t=>e+=t.pnl)],mn=Math.min(...p),mx=Math.max(...p),r=mx-mn||1,pts=p.map((v,i)=>`${(i/(p.length-1||1)*600).toFixed(1)},${(170-(v-mn)/r*160).toFixed(1)}`).join(' ');
return`<svg viewBox="0 0 600 180" preserveAspectRatio="none" style="width:100%;height:190px"><polygon points="0,180 ${pts} 600,180" fill="rgba(16,185,129,.1)"/><polyline points="${pts}" fill="none" stroke="#10b981" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg><div class="sub" style="display:flex;justify-content:space-between"><span>$${mn.toFixed(0)}</span><span>$${mx.toFixed(0)}</span></div>`}
function calendar(){const y=S.cm.getFullYear(),mo=S.cm.getMonth(),D={};closed(1).forEach(t=>{const d=D[t.date]=D[t.date]||{p:0,n:0};d.p+=t.pnl;d.n++});
const f=(new Date(y,mo,1).getDay()+6)%7,nd=new Date(y,mo+1,0).getDate();let h=`<div class="row" style="border:0"><button class="btn" onclick="S.cm=new Date(${y},${mo-1},1);render()">‹</button><b>${MON[mo]} ${y}</b><button class="btn" onclick="S.cm=new Date(${y},${mo+1},1);render()">›</button></div><div class="cal">`+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class=w>${d}</div>`).join('')+'<div style="background:none"></div>'.repeat(f);
for(let d=1;d<=nd;d++){const k=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),x=D[k];h+=`<div class="${x?x.p>=0?'pg':'pr':''}">${d}${x?`<b>${m(x.p)}</b>${x.n} сд.`:''}</div>`}return h+'</div>'}
function rank(L){if(!L.length)return'<div class=empty>Нет данных</div>';const blk=(t,f)=>`<div class=sub style="margin:6px 0 2px">${t}</div>`+grp(L,f).sort((a,b)=>b.pnl-a.pnl).slice(0,5).map(x=>`<div class=row><div style="min-width:0"><span class=tag>${x.k}</span><div class=sub>${x.n} сд. · WR ${x.wr.toFixed(0)}%</div></div><b class="${cl(x.pnl)}">${m(x.pnl)}</b></div>`).join('');return blk('Стратегии',t=>t.strat)+blk('Модели входа',t=>t.model)}
/* open trades */
const snaps=()=>{const Z=db.snap||{};return db.acc.filter(a=>(S.acc=='all'||a.id==S.acc)&&Z[a.login]&&Z[a.login].bal!=null).map(a=>({a,s:Z[a.login]}))};
const ago=ts=>{const x=(Date.now()-ts)/6e4|0;return x<1?'только что':x<60?x+' мин назад':(x/60|0)+' ч назад'};
function terminal(){const L=snaps();if(!L.length)return db.bot.ok?`<div class=card style="margin-bottom:10px"><h3>Терминал MT5</h3><div class=sub>Данных от робота пока нет. Установите советник SiriusSync на график MT5 и нажмите «Синхронизировать сейчас».</div></div>`:'';
const sm=k=>L.reduce((t,x)=>t+(+x.s[k]||0),0),age=Math.min(...L.map(x=>x.s.ts||0)),O=L.flatMap(x=>(x.s.ord||[]).map(o=>({...o,n:x.a.name}))),mo=v=>'$'+v.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
return `<div class=card style="margin-bottom:10px"><h3>Терминал MT5 · обновлено ${ago(age)}</h3><div class="grid k4" style="margin:0 0 6px"><div><div class=sub>Баланс</div><div class=kv>${mo(sm('bal'))}</div></div><div><div class=sub>Эквити</div><div class=kv>${mo(sm('eq'))}</div></div><div><div class=sub>Плав. P/L</div><div class="kv ${cl(sm('pl'))}">${m(sm('pl'))}</div></div><div><div class=sub>Маржа / Свободно</div><div class=kv style="font-size:16px">${mo(sm('mg'))} / ${mo(sm('fr'))}</div></div></div><div class=sub style="margin:8px 0 2px">Отложенные ордера (лимитки): ${O.length}</div>`+(O.length?O.map(o=>`<div class=row><span><span class="bd ${/BUY/.test(o.t)?'g':'r'}">${o.t}</span> <b>${o.s}</b> ${o.v}</span><span class=sub>@ ${o.p} · SL ${o.sl||'—'} · TP ${o.tp||'—'}${L.length>1?' · '+o.n:''}</span></div>`).join(''):'<div class=sub>Нет</div>')+'</div>'}
const openBlock=c=>{const O=scope().filter(t=>t.res=='OPEN');if(c&&!O.length)return'';return`<div class="card live" style="margin-bottom:10px"><h3>Открытые сделки (Live) · ${O.length}</h3>${O.length?O.map(openCard).join(''):'<div class=empty>Нет открытых позиций. Добавьте сделку со статусом OPEN или дождитесь сигнала от бота.</div>'}</div>`};
const f2=x=>x==null?'—':x;

function cls(id,k){const t=db.trades.find(x=>x.id==id),rem=t.rem||1,part=t.part||0,fee=+t.fee||0,r=+t.risk||0;
if(k=='half'){if(t.part)return toast('Уже снято 50%');t.part=r*.5;t.rem=.5;t.be=1;save();return render()}
if(k=='tp'){t.res='TP';t.pnl=part+rem*r*t.rr-fee}
else if(k=='sl'){t.pnl=part-(t.be?0:rem*r)-fee;t.res=t.be?'BU':'SL'}
else if(k=='bu'){t.res='BU';t.pnl=part-fee}
else{const v=prompt('Введите RR (например 2.5) или сумму в $ (например $120 или $-40):');if(!v)return;t.pnl=v.startsWith('$')?+v.slice(1):part+rem*r*(+v)-fee;t.res=t.pnl>0?'TP':t.pnl<0?'SL':'BU'}

const hs=x=>{let h=5381;for(let i=0;i<x.length;i++)h=(h*33^x.charCodeAt(i))|0;return h},sesOf=h=>h>=3&&h<9?SES[0]:h<11?SES[1]:h<16?SES[2]:SES[3];

async function backup(q){if(!db.bot.ok)return q||toast('Подключите бота');const s=JSON.stringify({...db,bot:{...db.bot,tok:'',hash:0,off:0}}),hh=hs(s);if(q&&hh==db.bot.hash)return;const fd=new FormData();fd.append('chat_id',db.bot.chat);fd.append('caption','SIRIUS backup '+new Date().toISOString());fd.append('document',new Blob([s],{type:'application/json'}),'sirius_backup.json');
try{const r=await tg('sendDocument',0,fd);if(r.ok){db.bot.hash=hh;save();await tg('pinChatMessage',{chat_id:db.bot.chat,message_id:r.result.message_id,disable_notification:true});q||toast('Копия сохранена в Telegram')}else q||toast(r.description)}catch(e){}}
async function restore(){const tok=prompt('Bot Token:',db.bot.tok),ch=prompt('Chat / Channel ID:',db.bot.chat);if(!tok||!ch)return;db.bot.tok=tok;db.bot.chat=ch;try{const c=await tg('getChat',{chat_id:ch}),p=c.result&&c.result.pinned_message;if(!p||!p.document)return toast('В чате нет закрепленной копии базы');const f=await tg('getFile',{file_id:p.document.file_id}),j=await fetch(`https://api.telegram.org/file/bot${tok}/${f.result.file_path}`).then(r=>r.json());db=j;db.bot.tok=tok;db.bot.chat=ch;db.bot.ok=1;save();render();toast('База восстановлена')}catch(e){toast('Не удалось восстановить')}}
async function expo(){const s=JSON.stringify(db),P=window.Capacitor&&Capacitor.Plugins;try{if(P&&P.Filesystem&&P.Share){const r=await P.Filesystem.writeFile({path:'sirius_journal.json',data:s,directory:'CACHE',encoding:'utf8'});return P.Share.share({title:'SIRIUS backup',url:r.uri})}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download='sirius_journal.json';a.click()}
const impo=f=>f&&f.text().then(x=>{db=JSON.parse(x);save();render()});
function demo(){const ac=db.acc,ins=Object.values(db.ins).flat();for(let i=0;i<70;i++){const d=new Date(Date.now()-Math.random()*60*864e5);if(d.getDay()%6==0)continue;const r=Math.random(),res=r<.45?'TP':r<.8?'SL':'BU',rr=[1,2,2,3][i%4],risk=[50,100,100,200][i%4],h=8+(Math.random()*14|0),
t={id:uid(),acc:ac[i%3].id,date:iso(d),time:String(h).padStart(2,'0')+':'+String(Math.random()*60|0).padStart(2,'0'),session:h<10?SES[1]:h<15?SES[2]:h<17?SES[2]:SES[3],sym:ins[Math.random()*ins.length|0],dir:Math.random()<.5?'BUY':'SELL',res,rr,risk,fee:2,strat:db.strat[Math.random()*9|0],model:db.model[Math.random()*11|0],psy:PSY[Math.random()<.6?0:1+(Math.random()*4|0)],c:{}};t.pnl=+pnlOf(res,risk,rr,2,'').toFixed(2);db.trades.push(t)}save();render()}
setInterval(()=>{if(--timer<0){timer=300;sync()}if(S.tab!='set'||1){const e=document.querySelector('.top .sub');if(e)e.textContent='Синхр. через '+String(timer/60|0).padStart(2,'0')+':'+String(timer%60).padStart(2,'0')}},1000);
$('#modal').onclick=e=>{if(e.target.id=='modal')closeM()};
render();setTimeout(()=>sync(),1500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
